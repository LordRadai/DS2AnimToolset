; Configuration for rebuild.bat (key=value, lines starting with ; are comments)

; morphemeConnect executable
CONNECT=C:\Program Files (x86)\NaturalMotion\morphemeConnect 3.6.2\bin\morphemeConnect.exe

; Python interpreter (python on PATH, or a full path)
PYTHON=python

; control parameter settings file (empty = tools\cp_config.json)
CP_CONFIG=

; 1 = delete the previous .mcn / paths and rebuild from scratch (recommended), 0 = keep them
CLEAN=1

; characters whose end-of-run warning box is skipped (comma separated, e.g. c1021,c2250): their differences are
; known, so mcnGenAll.bat can run unattended. The warning is still printed and the diff still written.
NO_WARN=c1021, c3080, c5065, c6820, c6830