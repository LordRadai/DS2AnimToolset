; Configuration for rebuild.bat (key=value, lines starting with ; are comments)

; morphemeConnect executable
CONNECT=C:\Program Files (x86)\NaturalMotion\morphemeConnect 3.6.2\bin\morphemeConnect.exe

; Python interpreter (python on PATH, or a full path)
PYTHON=python

; control parameter settings file (empty = tools\ds2_control_parameters.json)
CP_CONFIG=

; 1 = delete the previous .mcn / paths and rebuild from scratch (recommended), 0 = keep them
CLEAN=1
